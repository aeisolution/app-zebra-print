<!-- Content Header (Page header) -->
<ng-include src="'/app/common/pageHeader.html'"></ng-include>

<!-- Main content -->
<section class="content">

  <div class="row">
    <div class="col-md-12">

  <!-- Stampante -->
  <div class="box box-default">
      <div class="box-header">
        <div class="col-md-8">
          <h2 class="page-header"><i class="fa fa-print" data-toggle="collapse" data-target="#collapsePrinter" 
            aria-expanded="false" aria-controls="collapsePrinter"></i> Stampante</h2>
        </div>
        <div class="col-md-4">
            <h2 class="page-header pull-right">
              <select name="selected_device" ng-model="vm.selected_device" ng-options="item as item.name for item in vm.devices | orderBy: 'name' track by item.uid" class="form-control">
                  <option value="">-- seleziona --</option>
                </select>
            </h2>
        </div>
      </div><!-- /.box-header -->
      <!-- form start -->
  
      <div class="box-body collapse" id="collapsePrinter" > 
        <h3>selected_device</h3>
          <pre>
              {{ vm.selected_device | json }}
          </pre>
          <h3>devices</h3>
          <pre>
            {{ vm.devices | json }}
          </pre>

          <span class="col-md-12 input-group-btn">
              <button class="btn btn-default" type="button" ng-click="vm.getConfig()"><i class="fa fa-info"></i> getConfig</button>
              <button class="btn btn-default" type="button" ng-click="vm.getDeviceCallback()"><i class="fa fa-cubes"></i> getDeviceCallback</button>
              <button class="btn btn-default" type="button" ng-click="vm.readFromSelectedPrinter()"><i class="fa fa-cubes"></i> readFromSelectedPrinter</button>
              <button class="btn btn-default" type="button" ng-click="vm.sendCommandZPL()"><i class="fa fa-cubes"></i> sendCommandZPL</button>
              <button class="btn btn-default" type="button" ng-click="vm.writeToDefaultPrinter()"><i class="fa fa-cubes"></i> writeToDefaultPrinter</button>
              
          </span>
      </div>
  </div>

    <!-- Articolo -->
    <ng-include src="'/app/components/etichette/articoloDtl.html'"></ng-include>


    </div>
  </div>

  <!-- Etichetta -->
  <div class="box box-success">
    <div class="box-header with-border" style="padding-bottom: 0px;">
      <div class="col-md-8">
        <h2 class="page-header"><i class="fa fa-tag"></i> Etichetta</h2>
      </div>

    </div><!-- /.box-header -->
    <!-- form start -->

    <div class="box-body"> 
        <form name="frmArticolo" role="form" novalidate>
            <div class="form-group col-md-4">
              <label for="codice">Codice</label>
              <input type="text" name="codice" ng-model="vm.etichetta.codice" class="form-control">
            </div>
      
            <div class="form-group col-md-8">
              <label for="descrizione">Articolo</label>
              <input type="text" name="descrizione" ng-model="vm.etichetta.descrizione" class="form-control">
            </div>

 
            <div class="form-group col-md-4">
              <label for="prezzo">Prezzo (€)</label>
              <input type="number" format="number" step="0.01"  name="prezzo" ng-model="vm.etichetta.prezzo" class="form-control" required>
            </div> 

            <div class="form-group col-md-8">
              <label for="dettaglio">Dettaglio</label>
              <input type="text" name="dettaglio" ng-model="vm.etichetta.dettaglio" class="form-control">
            </div>
                    
            <div class="form-group col-md-offset-4 col-md-8">
              <label for="dettaglio">Dettaglio 2</label>
              <input type="text" name="dettaglio" ng-model="vm.etichetta.dettaglio2" class="form-control">
            </div>

            <div class="col-md-12">
              <div class="pull-right">
                <button ng-click="vm.printEtichetta(false)" class="btn btn btn-default" type="button"><i class="fa fa-print" aria-hidden="true"></i> Etichetta </button>
                <button ng-click="vm.printEtichetta(true)" class="btn btn-default"><i class="fa fa-print"></i> Etichetta con Prezzo </button>
              </div>   
            </div>
          </form>  
    </div>

  </div>

  <!-- Etichetta -->
  <div class="box box-warning">
    <div class="box-header with-border" style="padding-bottom: 0px;">
      <div class="col-md-8">
        <h2 class="page-header"><i class="fa fa-tag"></i> Ricevuta per Riparazione</h2>
      </div>

    </div><!-- /.box-header -->
    <!-- form start -->

    <div class="box-body"> 
        <form name="frmRiparazione" role="form" novalidate>
          <div class="form-group col-md-4">
            <label for="id">ID Riparazione</label>
            <input type="text" name="id" ng-model="vm.ricevuta.id" class="form-control">
          </div>

          <div class="form-group col-md-4">
            <label for="dtAccettazione">Accettazione</label>
            <input type="text" name="dtAccettazione" ng-model="vm.ricevuta.dtAccettazione" class="form-control">
          </div>

          <div class="form-group col-md-4">
            <label for="dtConsegna">Consegna</label>
            <input type="text" name="dtConsegna" ng-model="vm.ricevuta.dtConsegna" class="form-control">
          </div>

          <div class="form-group col-md-6">
            <label for="nominativo">Nominativo</label>
            <input type="text" name="nominativo" ng-model="vm.ricevuta.nominativo" class="form-control">
          </div>

          <div class="form-group col-md-4">
            <label for="telefono">Tel.</label>
            <input type="text" name="telefono" ng-model="vm.ricevuta.telefono" class="form-control">
          </div>          

          <div class="form-group col-md-4">
            <label for="cellulare">Cell.</label>
            <input type="text" name="cellulare" ng-model="vm.ricevuta.cellulare" class="form-control">
          </div>          

          <div class="form-group col-md-4">
            <label for="acconto">Acconto (€)</label>
            <input type="number" format="number" step="0.01"  name="acconto" ng-model="vm.ricevuta.acconto" class="form-control" >
          </div>          

          <div class="form-group col-md-4">
            <label for="preventivo">Preventivo (€)</label>
            <input type="number" format="number" step="0.01"  name="preventivo" ng-model="vm.ricevuta.preventivo" class="form-control" >
          </div>          


          <div class="form-group col-md-12">
            <label for="dettaglio">Caratteristiche Oggetto e Descrizione Lavori</label>
            <textarea ng-model="vm.ricevuta.dettaglio" class="form-control" rows="6"></textarea>
          </div>

          <div class="col-md-12">
            <div class="pull-right">
              <button ng-click="vm.zplRicevuta()" class="btn btn btn-default" type="button"><i class="fa fa-print" aria-hidden="true"></i> Genera ZPL </button>
            </div>   
          </div>


          <div class="form-group col-md-12">
            <label>Comandi ZPL</label>
            <textarea ng-model="vm.ricevuta.zpl" class="form-control" rows="10"></textarea>
          </div>   


            <div class="col-md-12">
              <div class="pull-right">
                <button ng-click="vm.printRicevuta()" class="btn btn btn-default" type="button"><i class="fa fa-print" aria-hidden="true"></i> Ricevuta </button>
              </div>   
            </div>
          </form>  
    </div>

</div>  
  
</section><!-- /.content -->

<div class="login-box">
  <div class="login-logo">
    <a href="#/">Good<b>will</b></a>
  </div><!-- /.login-logo -->
  <div class="login-box-body">
    <p class="login-box-msg">Selezionare Utenti di Accesso</p>
    <form name="loginForm" role="form">
      <div  class="form-group">
          <button ng-repeat="user in vm.users" type="button" class="btn btn-default btn-lg btn-block" ng-click="vm.user.username=user.username; setFocusToPassword();" >
            <span class="glyphicon glyphicon-user" aria-hidden="true"></span> {{ user.display }} 
          </button>
      </div>

      <div class="form-group has-feedback" ng-class="{'has-error': loginForm.username.$dirty && loginForm.username.$invalid }">
        <input type="text" name="username" ng-model="vm.user.username" class="form-control" placeholder="Username" readonly>
        <span class="glyphicon glyphicon-user form-control-feedback"></span>
      </div>
      <div class="form-group has-feedback" ng-class="{'has-error': loginForm.password.$dirty && loginForm.password.$invalid }">
        <input type="password" id="inputPassword" name="password" ng-model="vm.user.password" class="form-control" placeholder="Password">
        <span class="glyphicon glyphicon-lock form-control-feedback"></span>
      </div>

      <div class="row">
        <div class="col-xs-4">
          <button ng-disabled="loginForm.$pristine || loginForm.$invalid" ng-click="vm.login()" class="btn btn-primary btn-block btn-flat">Accedi</button>
        </div><!-- /.col -->
      </div>
    </form>

    <!--
    <a href="#">Password dimenticata</a><br>
    <a href="register.html" class="text-center">Register a new membership</a>
    -->

  </div><!-- /.login-box-body -->
</div><!-- /.login-box -->

<script>
  function setFocusToPassword(){
    //What to do here
    console.log("setFocusToPassword");
    document.getElementsByName('password')[0].focus();
  }
</script>
